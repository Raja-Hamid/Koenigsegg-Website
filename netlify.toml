[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- redirects ----
# The pre-Astro build used ALL-CAPS extensioned paths. Anything already shared
# or indexed under those URLs 301s to the new route so no inbound link 404s.
[[redirects]]
  from = "/HOME.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/COLLECTION.html"
  to = "/collection/"
  status = 301
[[redirects]]
  from = "/ABOUT.html"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/CONTACT.html"
  to = "/contact/"
  status = 301

# ---- caching ----
# Content-hashed assets are immutable and can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate, or a directory index can pin a stale build.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # No third-party origins: fonts are self-hosted and icons are inline SVG,
    # so the only thing this needs to allow is 'self'. Astro inlines small
    # stylesheets and hydration scripts, hence 'unsafe-inline' for style/script.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self' https:; frame-ancestors 'none'; base-uri 'self'"
